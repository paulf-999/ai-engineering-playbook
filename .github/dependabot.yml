---
# Opens weekly PRs to update pinned dependencies (see https://docs.github.com/code-security/dependabot)
version: 2
updates:
    # Python packages pinned in requirements.txt
    - package-ecosystem: pip
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: chore
          include: scope
    # Actions used in .github/workflows/
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: ci
          include: scope
