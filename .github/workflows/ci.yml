---
# Re-run the local git hooks and tests on every PR, so `git commit --no-verify` can't skip them,
# and check the PR's title, size and author's open PRs
name: CI

on:
    pull_request:
        branches: [main]
    # Also run on main, so its caches are saved where every new PR can reuse them
    push:
        branches: [main]

permissions:
    contents: read

# Cancel an older run on the same PR (or on main) when new commits are pushed
concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: 'Lint: run the pre-commit hooks'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
              with:
                  python-version: '3.13'
                  cache: pip
                  cache-dependency-path: requirements.txt
            # Only pre-commit is needed here, since each hook installs its own tools
            # It installs the pre-commit version pinned in requirements.txt
            - name: Install pre-commit
              run: pip install "$(grep -oE '^pre-commit==[^ ]+' requirements.txt)"
            # Passed through env, not ${{ }} in the script, so a crafted branch name can't inject shell
            # Skipped for Dependabot's PRs, since its dependabot/... branch names can't be changed
            - name: Validate branch name
              if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
              env:
                  BRANCH_NAME: ${{ github.head_ref }}
              run: src/sh/git/git_validate_branch_name.sh "${BRANCH_NAME}"
            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
              with:
                  path: ~/.cache/pre-commit
                  key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
            # CI checks out a detached merge commit, so the branch hooks are skipped here and checked above,
            # and the token report is skipped, since main's own src/claude/ changes would make it stale
            - name: Run pre-commit hooks
              env:
                  SKIP: no-commit-to-branch,git_branch_name_validation,claude_report_context_cost
              run: pre-commit run --all-files --show-diff-on-failure

    pr_title:
        name: 'PR title: check it follows Conventional Commits'
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false
            # Squash merges use the PR title as the commit message on main, so commitlint checks it with the config
            # version the commit-msg hook pins in .pre-commit-config.yaml, and the matching CLI release
            # Passed through env, not ${{ }} in the script, so a crafted title can't inject shell
            - name: Validate PR title
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: src/sh/git/git_validate_pr_title.sh "${PR_TITLE}"

    pr_size:
        name: "PR size: check it's within the file limit"
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false
                  # full history, so the PR's changes can be diffed against its base
                  fetch-depth: 0
            # Passed through env, not ${{ }} in the script, so a crafted branch name can't inject shell
            - name: Validate number of changed files
              env:
                  BRANCH_NAME: ${{ github.head_ref }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: src/sh/git/git_validate_num_file_changes.sh "${BRANCH_NAME}" "${BASE_SHA}" "${HEAD_SHA}"

    open_prs:
        name: 'Open PRs: check the author is within the limit'
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            # list the repo's open PRs
            pull-requests: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false
            - name: Validate number of open PRs
              env:
                  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  GH_TOKEN: ${{ github.token }}
              run: src/sh/git/git_validate_open_prs.sh "${PR_AUTHOR}" "${GITHUB_REPOSITORY}" "${PR_NUMBER}"

    skill_versions:
        name: 'Skill versions: check each changed skill bumps its version'
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false
                  # full history, so the PR's changes can be diffed against its base
                  fetch-depth: 0
            - name: Validate skill contract versions
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: src/sh/git/git_validate_skill_versions.sh "${BASE_SHA}" "${HEAD_SHA}"

    test:
        name: 'Tests: run pytest'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
              with:
                  python-version: '3.13'
                  cache: pip
                  cache-dependency-path: requirements.txt
            # The tests only need these packages, at the versions pinned in requirements.txt
            - name: Install pytest, pytest-xdist, pyyaml and jinja2
              run: pip install $(grep -oE '^(pytest|pytest-xdist|pyyaml|jinja2)==[^ ]+' requirements.txt)
            - name: Run tests
              run: pytest
