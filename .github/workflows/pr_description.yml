---
# version: 1.1.2
# created: 2026-11-02
# updated: 2026-11-10
# Check each PR description stays short and only uses full links, re-checking whenever it's edited,
# that a PR changing src/claude/ answers the evaluation criteria, and warn when a scored file changes without its row.
# A separate workflow from ci.yml, so editing a description doesn't re-run the tests.
name: PR description

on:
    pull_request:
        branches: [main]
        types: [opened, edited, reopened, synchronize]

permissions:
    contents: read
    # read the PR's changed files, to spot changes to the installed Claude config
    pull-requests: read

# Cancel an older run on the same PR when its description is edited again
concurrency:
    group: pr-description-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    pr_description:
        name: 'PR description: check details and links'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
            # Passed through env, not ${{ }} in the script, so a crafted description can't inject shell
            - name: Validate PR description
              env:
                  PR_DESCRIPTION: ${{ github.event.pull_request.body }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  CHANGED_FILES="$(gh pr diff "${PR_NUMBER}" --name-only --repo "${GITHUB_REPOSITORY}")"
                  src/sh/git/git_validate_pr_description.sh "${PR_DESCRIPTION}" "${CHANGED_FILES}"
            # Warn, never fail, when a changed file has a row in a quality audit the PR leaves untouched,
            # since a failing gate is what forced a re-score after every edit
            - name: Warn about score rows left out of date
              if: always()
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  CHANGED_FILES="$(gh pr diff "${PR_NUMBER}" --name-only --repo "${GITHUB_REPOSITORY}")"
                  while IFS= read -r file; do
                      [[ -n "${file}" ]] || continue
                      for audit in $(git ls-files 'docs/maintenance/quality/audits/*.md'); do
                          # each audit row links to its file as ../<repo path>)
                          if grep -qF "../${file})" "${audit}" && ! grep -qxF "${audit}" <<<"${CHANGED_FILES}"; then
                              echo "::warning file=${file}::${file} has a score row in ${audit}, which this PR doesn't update: re-score it with the reviewer brief in its rubric"
                          fi
                      done
                  done <<<"${CHANGED_FILES}"
