---
# Check that a PR says why it's there and what was run, that one changing src/claude/ carries its spec, that one changing
# an always-on or enforcing file answers the evaluation criteria, and that a bot's PR has a human assignee, re-checking
# whenever its description or assignees change.
# A separate workflow from ci.yml, so editing a description doesn't re-run the tests.
name: PR description

on:
    pull_request:
        branches: [main]
        types: [opened, edited, reopened, synchronize, assigned, unassigned]

permissions:
    contents: read
    # read the PR's changed files, to spot changes to the installed Claude config
    pull-requests: read

# Cancel an older run on the same PR when its description is edited again
concurrency:
    group: pr-description-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    pr_description:
        name: 'PR description: check evidence, plan and criteria'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false
            # A step of its own, so a failed fetch fails the check rather than passing an empty list
            - name: List the changed files
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  GH_TOKEN: ${{ github.token }}
              run: gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > "${RUNNER_TEMP}/changed_files"
            # Passed through env, not ${{ }} in the script, so a crafted description can't inject shell
            - name: Validate PR description
              env:
                  PR_DESCRIPTION: ${{ github.event.pull_request.body }}
                  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
              run: src/sh/git/git_validate_pr_description.sh "${PR_DESCRIPTION}" "$(cat "${RUNNER_TEMP}/changed_files")" "${PR_AUTHOR}"

    human_author:
        name: 'Human author: check a person is named'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false
            - name: Validate the author or an assignee is a person
              env:
                  AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
                  ASSIGNEE_TYPES: ${{ join(github.event.pull_request.assignees.*.type, ' ') }}
              run: src/sh/git/git_validate_human_author.sh "${AUTHOR_TYPE}" "${ASSIGNEE_TYPES}"
