---
evals:
  # Happy paths
    - name: happy_path_platform_risk_assessment
      trigger: confluence-create-page
      # Platform risk pattern — pre-fill themes from cited evidence, rate them, review, create after approval
      input:
          prompt: write a platform risk assessment for Airbyte

  # Pattern and place
    - name: space_not_named_is_confirmed
      trigger: confluence-create-page
      # The user names no space — Claude asks instead of inferring one
      input:
          prompt: create a confluence page called Data Platform Q4 Roadmap

    - name: parent_page_required
      trigger: confluence-create-page
      # The user asks for the space root — Claude asks for a parent page
      input:
          prompt: put the Q4 roadmap page in Confluence, at the top of the DOCS space

    - name: unsupported_pattern_offers_valid_ones
      trigger: confluence-create-page
      # The user asks for a page type the skill doesn't support, a not_for case
      input:
          prompt: create a confluence requirements page for the new ingestion service

  # Not for
    - name: jira_request_goes_elsewhere
      trigger: jira-create-issue
      # Asking for a Jira ticket is a not_for case
      input:
          prompt: create a jira ticket for the orders model timeout
