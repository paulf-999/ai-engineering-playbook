---
evals:
  # Happy path
    - name: named_type_kept
      trigger: jira-create-issue
      # The user asks for a bug, so the Story default doesn't apply
      input:
          prompt: create a bug in jira, the login page returns a 500 on submit

  # Stops
    - name: missing_mcp_server_stops
      behaviour: true
      # With no Atlassian MCP server, the pre-check fails, so the skill stops before drafting anything
      input:
          prompt: /jira-create-issue the dbt nightly run times out on the orders model
      assertions:
          - Claude tells the user to enable the Atlassian MCP server and restart Claude Code
          - Claude does not draft a ticket or show a summary, description or acceptance criteria

  # Not for
    - name: confluence_request_goes_elsewhere
      trigger: confluence-create-page
      # Asking for a Confluence page is a not_for case
      input:
          prompt: write a Confluence page about the orders model
