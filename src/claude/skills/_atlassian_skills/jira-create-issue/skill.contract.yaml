---
name: jira-create-issue
version: 1.0.0
summary: Create one Jira ticket that follows the team's conventions, after you approve the draft
test_coverage_level: comprehensive

dispatch:
    triggers:
        explicit:
            - /jira-create-issue
            - create a jira ticket
            - create a bug in jira
            - log this as a jira ticket
        contextual:
            - user wants a piece of work tracked as a new Jira ticket

    not_for:
        - updating, transitioning or commenting on an existing ticket
        - creating several tickets at once from a list or template
        - moving existing tickets between sprints
        - linking tickets to each other
        - writing a Confluence page → /confluence-create-page

requires:
    tools: [Read, getAccessibleAtlassianResources, getJiraIssue, searchJiraIssuesUsingJql, getJiraIssueTypeMetaWithFields, createJiraIssue]
    resources: [on_demand/style_guides/jira.md, on_demand/style_guides/jira/jira_team_conventions.md, _local/jira_values.md]
    mcp_servers: [Atlassian]

output:
    type: external_service
    confirmation_required: true
    reversible: false
    returns: [issue key, browse link]

dependencies:
    external: [Atlassian Jira]
    permissions: [create-issue access to the target project]
