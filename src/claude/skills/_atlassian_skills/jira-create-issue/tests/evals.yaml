---
skill_name: jira-create-issue

evals:
  # Happy path
    - name: happy_path_story_ticket
      description: Full flow — confirm the project, draft a Story, show it, create it after a yes
      input:
          prompt: /jira-create-issue the dbt nightly run times out on the orders model, 2 points, under DATA-310
          confirm_reply: y
      setup:
          values_file: present, project key DATA
          epic_exists: DATA-310
      expected_output: >
          Claude reads the Jira style guide, the team conventions and the values
          file, confirms the DATA project, drafts a Story under DATA-310 with a
          summary in the team format and acceptance criteria, shows the full
          ticket, and calls createJiraIssue only after the yes.
      assertions:
          - Claude reads jira_team_conventions.md and _local/jira_values.md before drafting
          - The draft's issue type is Story with DATA-310 as its parent epic
          - Claude confirms DATA-310 with getJiraIssue
          - Claude does not call createJiraIssue before the user says yes

    - name: named_type_kept
      trigger: jira-create-issue
      description: The user asks for a bug, so the Story default doesn't apply
      input:
          prompt: create a bug in jira, the login page returns a 500 on submit
      setup:
          values_file: present, project key DATA
      expected_output: >
          Claude drafts a Bug rather than a Story, and still shows the full
          ticket for approval before creating it.
      assertions:
          - The draft's issue type is Bug
          - Claude shows the full ticket before any createJiraIssue call

  # Setup
    - name: mcp_unavailable_stops
      description: The Atlassian MCP server isn't enabled — the skill stops before drafting
      input:
          prompt: /jira-create-issue fix the orders model timeout
      setup:
          mcp_available: false
      expected_output: >
          Claude tells the user to enable the Atlassian MCP server and restart
          Claude Code, and stops without drafting a ticket.
      assertions:
          - Claude names enabling the Atlassian MCP server and restarting Claude Code
          - Claude does not draft the ticket
          - Claude does not invent an issue key or link

  # Drafting
    - name: unknown_values_left_as_todo
      description: No values file and no epic given — unknowns are marked, not guessed
      input:
          prompt: /jira-create-issue add row-count tests to the orders model
      setup:
          values_file: missing
      expected_output: >
          Claude asks which project to use, offers to save the values-file template
          to _local/jira_values.md, and shows the draft with the parent epic, field
          IDs and business value scores as < TODO >.
      assertions:
          - Claude asks for the project rather than inferring one
          - The draft shows < TODO > for the parent epic and any field it can't fill
          - Claude does not invent an epic key, sprint ID or business value score

    - name: zero_story_points_queried
      description: Story points of 0 break the conventions table
      input:
          prompt: /jira-create-issue update the on-call rota page, 0 points, under DATA-300
      setup:
          values_file: present, project key DATA
      expected_output: >
          Claude says story points must be above 0, at least 0.5 for admin work,
          and asks for a new value instead of rounding it up.
      assertions:
          - Claude states that story points must be above 0
          - Claude asks for a new value rather than choosing one
          - Claude does not call createJiraIssue with 0 story points

    - name: missing_title_requested
      description: The request gives no clear piece of work — Claude asks rather than inventing one
      input:
          prompt: /jira-create-issue 2 points
      setup:
          values_file: present, project key DATA
      expected_output: >
          Claude asks what the ticket is for before drafting, and doesn't fill the
          summary with a placeholder.
      assertions:
          - Claude asks what the work is
          - Claude does not invent a summary

  # Confirm and create
    - name: declined_confirmation_creates_nothing
      description: The user says no at the confirm step
      input:
          prompt: /jira-create-issue fix the orders model timeout, 2 points, under DATA-310
          confirm_reply: no, not yet
      setup:
          values_file: present, project key DATA
      expected_output: >
          Claude shows the full ticket, the user declines, and Claude stops without
          creating anything, offering to change the draft.
      assertions:
          - Claude does not call createJiraIssue after the user declines
          - Claude does not claim a ticket was created

    - name: created_ticket_reports_key_and_link
      description: Jira creates the ticket — Claude reports its key and link
      input:
          prompt: /jira-create-issue fix the orders model timeout, 2 points, under DATA-310
          confirm_reply: y
      setup:
          values_file: present, project key DATA
          create_result: success, DATA-1234
      expected_output: >
          Claude creates the ticket after the yes and reports DATA-1234 with its
          browse link.
      assertions:
          - Claude reports the issue key and a browse link
          - Claude does not report success if the create call failed

  # Not for
    - name: update_request_out_of_scope
      description: The user asks to change an existing ticket, which the skill doesn't do
      input:
          prompt: /jira-create-issue update DATA-12 to 3 story points
      setup: {}
      expected_output: >
          Claude says this skill only creates new tickets and can't update DATA-12,
          and makes no create call.
      assertions:
          - Claude says updating an existing ticket is out of scope
          - Claude does not call createJiraIssue
          - Claude does not claim DATA-12 was updated

    - name: confluence_request_goes_elsewhere
      description: Asking for a Confluence page is a not_for case
      input:
          prompt: write a Confluence page about the orders model
      setup: {}
      expected_output: >
          jira-create-issue is not invoked, and no Jira ticket is drafted.
      assertions:
          - jira-create-issue is not invoked
          - Claude does not call createJiraIssue
