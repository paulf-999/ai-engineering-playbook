---
# Script tests: tests/src/claude/skills/_claude_skills/claude-capture-session-prompts/
# test_capture_session_prompts.py checks the date filter, the masking and the overwrite check.
# Not covered: never pasting raw history lines, which needs a real history file.

evals:
  # Happy paths
    - name: capture_past_date_without_rule
      trigger: claude-capture-session-prompts
      # A named date with no session notes rule writes to the current folder
      input:
          prompt: capture my session prompts for 2026-11-17

  # Not for
    - name: summarise_current_conversation
      trigger: none
      # Summarising this conversation doesn't need the script
      input:
          prompt: summarise what we've done in this session

    - name: multi_day_range_one_run_per_date
      trigger: claude-capture-session-prompts
      # The user asks for a week of prompts in one run
      input:
          prompt: capture my session prompts for the whole of last week
