---
name: claude-kaizen
version: 1.3.0
summary: Turn corrections that keep recurring in your feedback notes into proposed rules, each proved by an A/B eval
test_coverage_level: basic

dispatch:
    triggers:
        explicit:
            - /claude-kaizen
        contextual:
            - the session-start reminder suggests a run, and the user types /claude-kaizen

    not_for:
        - starting from a plain request such as "run kaizen", since it's slash-only to keep its description out of every session
        - saving a single new correction, which Claude's memory does as it happens
        - proposing a rule from a correction seen once that only fits this repo
        - changing a rule without an A/B case showing it helps
        - committing or opening the PR, which /git-create-pr does
        - pruning or reviewing existing rules, which the regular quality review does

requires:
    tools: [Read, Edit, Bash]
    resources: [feedback notes in the session's auto-memory folder, this repo's rules/evals.yaml and make evals]
    mcp_servers: []

output:
    type: file
    confirmation_required: true
    reversible: true
    returns: [proposed rule diffs, each case's A/B verdict, the rules kept in the working tree]

dependencies:
    external: [claude CLI logged in, for make evals RULES=1]
    permissions: [write access to src/claude/rules/ in the working tree]
