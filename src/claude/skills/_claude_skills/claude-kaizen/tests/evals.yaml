---
# Runner tests: tests/src/py/test_claude_run_rule_evals.py checks the CASE filter this skill relies on.

evals:
  # Triggering
    - name: plain_request_doesnt_fire
      trigger: none
      # The skill is slash-only, so a plain request to run kaizen doesn't start it
      input:
          prompt: run kaizen on my feedback notes

  # Not for
    - name: single_correction_saved_to_memory
      trigger: none
      # A one-off correction is saved to memory, not run through kaizen
      input:
          prompt: Remember that I prefer short commit messages

    - name: rule_review_goes_elsewhere
      trigger: none
      # Reviewing the existing rules isn't kaizen's job
      input:
          prompt: Review the always-on rules for bloat
